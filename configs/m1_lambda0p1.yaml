# configs/m1_lambda0p1.yaml
# Run B: InfoNCE + SIGReg (sigreg_lambda = 0.1)

seed: 0
precision: bf16

model:
  vision_repo: facebook/vjepa2-vitl-fpc64-256
  text_backbone: embeddinggemma
  predictor_mode: llama_last8
  shared_dim: 1536
  temperature: 0.07
  stack_factor: 4
  predictor_layers: 4
  text_max_length: 512
  unfreeze_text: false
  queue_size: 0
  loss_type: info_nce
  sigreg_lambda: 0.1

data:
  name: vatex
  num_frames: 64
  resolution: 256
  video_dir: /home/jovyan/work/data/vatex/video
  annotation_train: /home/jovyan/work/data/vatex/vatex_final_curated.json
  annotation_eval: /home/jovyan/work/data/msrvtt/msrvtt_test_1k.json
  train_split_filter: null
  eval_split_filter: null
  eval_captions_per_video: 1
  feature_cache_dir: /home/jovyan/work/data/feature_cache

optim:
  lr: 1.0e-4
  weight_decay: 0.05
  betas: [0.9, 0.98]
  eps: 1.0e-8
  grad_clip: 1.0
  total_steps: 500
  warmup_steps: 50

train:
  batch_size: 1024
  gradient_accumulation_steps: 1
  grad_cache: true
  grad_cache_micro_batch: 16
  num_workers: 0
  log_every: 20
  save_every: 250
  ckpt_dir: /home/jovyan/work/JEPA-Omni/checkpoints/m1_lambda0p1
  m0_gate_steps: 600
