# configs/m1.yaml
# M1 — offline vision perception spine (VL-JEPA reproduction).
# Two profiles: an ungated SMOKE default (runs with no HF license), and the FAITHFUL
# overrides (commented) that reproduce VL-JEPA 2512.10942 exactly.

model:
  vision_repo: facebook/vjepa2-vitl-fpc64-256   # MIT, ungated
  text_backbone: minilm        # FAITHFUL: embeddinggemma  (GATED: accept license + HF_TOKEN)
  predictor_mode: mlp          # FAITHFUL: llama_last8 (agent task) or "transformer"
  shared_dim: 1536             # VL-JEPA shared space
  temperature: 0.07
  stack_factor: 1
  predictor_layers: 4
  text_max_length: 512
  unfreeze_text: false         # FAITHFUL: true, with lr_mult 0.05 on the text base

data:
  name: msrvtt                 # retrieval gate set; agent fills data/video_text_dataset.py
  root: /scratch/$USER/data/msrvtt
  num_frames: 64
  resolution: 256
  caption_per_clip: 1

train:
  epochs: 10
  batch_size: 16               # tune to VRAM after probe_latency.py
  grad_accum: 1
  lr: 2.0e-4
  text_lr_mult: 0.05           # only used if unfreeze_text
  weight_decay: 0.05
  warmup_steps: 500
  precision: bf16
  num_workers: 8
  log_every: 20
  ckpt_dir: /scratch/$USER/jepa_omni/ckpt/m1
  seed: 0

eval:
  split: test
  metrics: [R@1, R@5, R@10, MedR]   # video->text and text->video retrieval
  # M1 GATE: R@1 within 5 pts of a SigLIP2 baseline on the held-out split.
  # ABORT/SWITCH ENCODER if > 10 pts worse -> try V-JEPA 2.1 or a VLM-aligned encoder.
  baseline_r1: null            # fill after running a SigLIP2 baseline
