# configs/m1.yaml
# M1 — offline vision perception spine (VL-JEPA reproduction).
# Schema aligned with train_m1.py / eval_m1.py / video_text_dataset.py cfg_get keys.
# Two profiles: ungated SMOKE default (no HF license) + FAITHFUL overrides (commented).

seed: 0
precision: bf16

model:
  vision_repo: facebook/vjepa2-vitl-fpc64-256   # MIT, ungated
  text_backbone: embeddinggemma        # FAITHFUL: embeddinggemma  (GATED: accept license + HF_TOKEN)
  predictor_mode: mlp        # SwiGLU MLP predictor
  shared_dim: 1536             # VL-JEPA shared space
  temperature: 0.07
  stack_factor: 4
  predictor_layers: 4
  text_max_length: 512
  unfreeze_text: false         # FAITHFUL: true (with optim.text_lr_mult below)
  queue_size: 0
  loss_type: info_nce            # info_nce with secondary SIGReg
  sigreg_lambda: 0.1

data:
  name: vatex
  num_frames: 64              # read as data.num_frames
  resolution: 256             # read as data.resolution
  video_dir: /home/jovyan/work/data/vatex/video
  annotation_train: /home/jovyan/work/data/vatex/vatex_final_curated.json
  annotation_eval: /home/jovyan/work/data/msrvtt/msrvtt_test_1k.json
  train_split_filter: null    # These JSONs are pre-split, so set to null to keep all entries
  eval_split_filter: null
  eval_captions_per_video: 1   # 1:1 video<->text for diagonal retrieval
  feature_cache_dir: /home/jovyan/work/data/feature_cache

optim:
  lr: 1.0e-4
  weight_decay: 0.05
  betas: [0.9, 0.98]
  eps: 1.0e-8
  grad_clip: 1.0
  total_steps: 400
  warmup_steps: 20
  text_lr_mult: 0.05           # only used if model.unfreeze_text

train:
  batch_size: 64
  gradient_accumulation_steps: 16
  grad_cache: true
  grad_cache_micro_batch: 4
  num_workers: 0
  log_every: 50
  save_every: 1000
  ckpt_dir: /home/jovyan/work/JEPA-Omni/checkpoints/m1 
  m0_gate_steps: 300

eval:
  batch_size: 16
  metrics: [R@1, R@5, R@10, MedR]   # video->text and text->video retrieval
  # M1 GATE: video->text R@1 within within_margin of the SigLIP2 baseline.
  baseline_r1: 32.50            # fill after measuring a SigLIP2 baseline separately
  within_margin: 5             # PASS if within 5 pts
  abort_margin: 10             # ABORT/switch encoder if >10 pts worse